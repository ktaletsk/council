# Multi-Agent Code Review Configuration
# ======================================
#
# agents: List of reviewers to run in parallel. Each entry specifies:
#   - backend: which CLI tool runs this reviewer
#   - model:   model identifier (format depends on backend)
#
# Supported backends:
#   "opencode"    → opencode run    (provider/model format)
#   "claude-code" → claude -p       (model alias or full name)
#   "codex"       → codex exec      (model name)
#   "cursor"      → cursor-agent    (model name)
#
# You can mix backends freely — run each model through whichever
# CLI tool you have access to.
#
# Model IDs verified against `opencode models` and `cursor-agent models`
# (a.k.a. `agent models`) as of this revision.

agents:
  # --- Frontier proprietary (opencode / Bedrock) ---
  - backend: opencode
    model: amazon-bedrock/us.anthropic.claude-opus-4-8

  - backend: opencode
    model: amazon-bedrock/us.anthropic.claude-sonnet-4-6

  # --- Frontier open-source / OSS (Bedrock) ---
  - backend: opencode
    model: amazon-bedrock/qwen.qwen3-coder-next

  - backend: opencode
    model: amazon-bedrock/zai.glm-5

  - backend: opencode
    model: amazon-bedrock/moonshotai.kimi-k2.5

  # --- Free models (opencode zen) ---
  - backend: opencode
    model: opencode/big-pickle

  - backend: opencode
    model: opencode/minimax-m3-free

  - backend: opencode
    model: opencode/nemotron-3-super-free

  # --- Cursor backend ---
  - backend: cursor
    model: gemini-3.1-pro

  - backend: cursor
    model: grok-4.3

  - backend: cursor
    model: gpt-5.5-high
